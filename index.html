<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كل سنة وانتي طيبة يا حبيبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root{
    --wine: #5B1A33;
    --rose: #C8446B;
    --blush: #F6D6DC;
    --paper: #FCF4F2;
    --gold: #C9A24A;
    --ink: #3A2A2E;
    --muted: #8A6F75;
    --serif: 'Amiri', 'Times New Roman', serif;
    --sans: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    box-sizing: border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{ box-sizing: inherit; }

body{
    margin:0;
    padding:0;
    background-color: var(--wine);
    color: var(--blush);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

/* ---------------- ENVELOPE OVERLAY ---------------- */
.envelope-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--wine);
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.envelope-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.envelope-wrapper {
    cursor: pointer;
    perspective: 1000px;
    text-align: center;
}

.envelope {
    width: 280px;
    height: 180px;
    background: #4a1328;
    border: 2px solid var(--gold);
    border-radius: 12px;
    position: relative;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.4s ease;
}

.envelope:hover {
    transform: scale(1.03);
}

.envelope-seal {
    width: 60px;
    height: 60px;
    background: var(--rose);
    border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.8rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.envelope-text {
    margin-top: 20px;
    font-family: var(--serif);
    font-size: 1.4rem;
    color: var(--paper);
}

/* ---------------- MAIN CONTAINER ---------------- */
.container{
    width: 100%;
    max-width: 600px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 2;
}

.years-display {
    font-family: var(--serif);
    font-size: clamp(7rem, 25vw, 11rem);
    line-height: 1;
    font-weight: 700;
    color: var(--rose);
    margin: 10px 0 0 0;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.greeting {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    color: var(--paper);
    margin: 10px 0 15px 0;
    font-weight: 700;
}

.sub-greeting {
    font-size: 1.1rem;
    color: var(--blush);
    opacity: 0.9;
    margin-bottom: 30px;
}

.gift-btn {
    background: linear-gradient(135deg, var(--rose), #9e2a4b);
    color: white;
    border: 1px solid var(--gold);
    padding: 14px 32px;
    font-size: 1.2rem;
    font-family: var(--sans);
    font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(200, 68, 107, 0.4);
    transition: all 0.3s ease;
    margin-bottom: 40px;
}

.gift-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(200, 68, 107, 0.6);
}

.section-title {
    font-family: var(--serif);
    font-size: 1.8rem;
    color: var(--gold);
    margin: 30px 0 20px 0;
}

/* ---------------- GALLERY & ZOOM ---------------- */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    width: 100%;
    margin-bottom: 30px;
}

.gallery-item {
    border-radius: 16px;
    overflow: hidden;
    height: 180px;
    border: 1px solid rgba(246, 214, 220, 0.2);
    cursor: pointer;
    position: relative;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.gallery-item:hover img {
    transform: scale(1.08);
}

/* ---------------- TIMELINE & REASONS ---------------- */
.memories-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 30px;
}

.memory-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(246, 214, 220, 0.15);
    padding: 16px 20px;
    border-radius: 16px;
    text-align: right;
    backdrop-filter: blur(5px);
}

.memory-card .date {
    font-size: 0.85rem;
    color: var(--gold);
    margin-bottom: 4px;
}

.memory-card .title {
    font-size: 1.1rem;
    color: var(--paper);
    font-weight: 700;
}

.reasons-box {
    background: rgba(0, 0, 0, 0.25);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    margin-bottom: 40px;
    border: 1px solid rgba(246, 214, 220, 0.15);
}

.reasons-box ul {
    margin: 0;
    padding-right: 20px;
    text-align: right;
}

.reasons-box li {
    margin-bottom: 12px;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--paper);
}

/* ---------------- MODALS & LIGHTBOX ---------------- */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
}

.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.modal-content {
    background: #3c1021;
    border: 2px solid var(--gold);
    padding: 25px;
    border-radius: 24px;
    max-width: 450px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

.modal-content img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.1);
}

.modal-content h3 {
    font-family: var(--serif);
    color: var(--gold);
    font-size: 1.6rem;
    margin: 0 0 10px 0;
}

.modal-content p {
    color: var(--paper);
    font-size: 1.1rem;
    margin-bottom: 20px;
}

.lightbox-img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 16px;
    border: 2px solid var(--gold);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.close-btn {
    background: var(--rose);
    color: white;
    border: none;
    padding: 10px 25px;
    font-size: 1rem;
    border-radius: 30px;
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 700;
}
</style>
</head>
<body>

<!-- شاشة الظرف عند الفتح -->
<div class="envelope-overlay" id="envelopeOverlay">
    <div class="envelope-wrapper" onclick="openEnvelope()">
        <div class="envelope">
            <div class="envelope-seal">💌</div>
        </div>
        <div class="envelope-text">اضغطي هنا لتفتحي الرسالة 🤍</div>
    </div>
</div>

<div class="container">
    <div class="years-display">١٩</div>
    
    <h1 class="greeting">كل سنة وانتي طيبة يا حبيبة 🤍</h1>
    <p class="sub-greeting">سنة جديدة من عمرك، وأنا فرحان إني جنبك فيها.</p>

    <button class="gift-btn" onclick="openGiftModal()">
        شوفتي الهدية دي؟ 🎁
    </button>

    <h2 class="section-title">صور من ذكرياتنا</h2>
    <div class="gallery-grid">
        <div class="gallery-item" onclick="zoomImage('images/MY BABE PHOTO.jpeg')">
            <img src="images/MY BABE PHOTO.jpeg" alt="ذكرياتنا">
        </div>
        <div class="gallery-item" onclick="zoomImage('images/my babe photo 2.jpeg')">
            <img src="images/my babe photo 2.jpeg" alt="ذكرياتنا">
        </div>
        <div class="gallery-item" onclick="zoomImage('images/my babe photo 3.jpeg')">
            <img src="images/my babe photo 3.jpeg" alt="ذكرياتنا">
        </div>
    </div>

    <h2 class="section-title">أحلى محطات بينا</h2>
    <div class="memories-list" id="memories-container"></div>

    <h2 class="section-title">ليه بحبك؟</h2>
    <div class="reasons-box">
        <ul id="reasons-container"></ul>
    </div>
</div>

<!-- Modal الهدية -->
<div class="modal-overlay" id="giftModal">
    <div class="modal-content">
        <img src="images/my babe gift.jpg" alt="هدية الخاتم">
        <h3>أحلى خاتم لأحلى حبيبة</h3>
        <p>ربنا يخليكي ليا وما تحرمنيش منك ابداً يا أجمل صدفة في حياتي.</p>
        <button class="close-btn" onclick="closeGiftModal()">حبيبي تسلملي 🤍</button>
    </div>
</div>

<!-- Lightbox لتكبير الصور -->
<div class="modal-overlay" id="imageLightbox" onclick="closeLightbox()">
    <img src="" id="lightboxImg" class="lightbox-img" alt="صورة مكبرة">
</div>

<script>
    const CONFIG = {
        memories: [
            { title: 'أول مرة اتكلمنا', date: '2024-05-22T00:00:00' },
            { title: 'أول مرة تقابلنا', date: '2024-10-26T00:00:00' },
            { title: 'يوم ما اعترفت بحبي', date: '2025-02-01T00:00:00' }
        ],
        reasons: [
            'ضحكتك لما تحاولي تمسكيها ومتعرفيش',
            'إنك بتفتكري التفاصيل الصغيرة اللي أنا نفسي بنساها',
            'طريقتك لما تتحمسي لحاجة وتحكيها بسرعة',
            'إن الكلام معاكي عمره ما بييبقى ممل'
        ]
    };

    function openEnvelope() {
        document.getElementById('envelopeOverlay').classList.add('hidden');
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.5 } });
    }

    const memoriesContainer = document.getElementById('memories-container');
    CONFIG.memories.forEach(mem => {
        const card = document.createElement('div');
        card.className = 'memory-card';
        card.innerHTML = `
            <div class="date">${new Date(mem.date).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
            <div class="title">${mem.title}</div>
        `;
        memoriesContainer.appendChild(card);
    });

    const reasonsContainer = document.getElementById('reasons-container');
    CONFIG.reasons.forEach(reason => {
        const li = document.createElement('li');
        li.textContent = reason;
        reasonsContainer.appendChild(li);
    });

    function openGiftModal() {
        document.getElementById('giftModal').classList.add('active');
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }

    function closeGiftModal() {
        document.getElementById('giftModal').classList.remove('active');
    }

    function zoomImage(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('imageLightbox').classList.add('active');
    }

    function closeLightbox() {
        document.getElementById('imageLightbox').classList.remove('active');
    }
</script>

</body>
</html>
